<!DOCTYPE html>

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">A</div>
    AquaPura
  </div>
  <nav>
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="problema.html">Problema</a></li>
      <li><a href="solucion.html">Solución</a></li>

    </ul>
  </nav>
  <button id="theme-toggle" onclick="toggleTheme()">Modo oscuro</button>
</header>

<section id="contacto">
  <h2>Contacto</h2>
  <form id="contact-form" onsubmit="return validarFormulario(event)">
    <div>
      <input type="text" id="nombre" placeholder="Tu nombre" required>
      <span class="error-msg" id="error-nombre">Por favor ingresa tu nombre.</span>
    </div>
    <div>
      <input type="email" id="email" placeholder="Tu correo electrónico" required>
      <span class="error-msg" id="error-email">Ingresa un correo electrónico válido.</span>
    </div>
    <div>
      <textarea id="mensaje" placeholder="Cuéntanos qué necesitas..." required></textarea>
      <span class="error-msg" id="error-mensaje">Escribe un mensaje antes de enviar.</span>
    </div>
    <button type="submit" class="btn">Enviar mensaje</button>
  </form>
</section>

<footer>
  <p>AquaPura &copy; 2026 — Agua pura, en cualquier lugar.</p>

    <a href="inicio.html">Inicio</a>|
    <a href="contacto.html">Contacto</a>|
